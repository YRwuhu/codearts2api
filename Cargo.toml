[package]
name = "codearts2api"
version = "0.1.0"
edition = "2021"
description = "Huawei Cloud CodeArts -> OpenAI compatible proxy"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
url = "2"
chrono = "0.4"
futures-util = "0.3"
async-stream = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
